[project]
name = "squish-toy"
version = "0.11.0"
description = "A webcam-controlled interactive digital stress toy"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe==0.10.21",
    "opencv-contrib-python>=4.10,<4.12",
    "pygame>=2.6,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


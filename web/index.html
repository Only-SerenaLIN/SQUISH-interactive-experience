<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06152d">
  <meta name="description" content="Jellyfish Grove 水母之森——一座会持续生长的深海水母生态缸。">
  <title>Jellyfish Grove · 水母之森</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="game-shell" aria-label="Jellyfish Grove 水母之森">
    <canvas id="game" aria-label="可拖动和缩放的水母之森游戏画布"></canvas>
    <header class="brand glass"><div class="brand-mark" aria-hidden="true">✦</div><div><h1>水母之森</h1><p>JELLYFISH GROVE · 浮光之域</p></div></header>
    <section class="hud glass" aria-label="生态状态">
      <div class="hud-item"><span class="hud-icon glow-icon">◆</span><div><strong id="glow-value">0</strong><small>浮光</small></div></div>
      <div class="hud-item"><span class="hud-icon">↗</span><div><strong id="rate-value">0 / 秒</strong><small>自然产出</small></div></div>
      <div class="hud-item"><span class="hud-icon">◌</span><div><strong id="jelly-value">1</strong><small>小水母</small></div></div>
    </section>
    <nav class="view-tools glass" aria-label="视野工具">
      <button id="zoom-in" title="放大">＋</button><button id="zoom-out" title="缩小">−</button><button id="home-view" title="回到母水母">⌂</button><button id="sound-toggle" title="环境音" aria-pressed="false">♪</button>
    </nav>
    <aside id="inspector" class="inspector glass is-hidden" aria-live="polite">
      <button id="close-inspector" class="close" aria-label="关闭">×</button>
      <span id="inspect-species" class="eyebrow">蓝水母 · 沉静</span><h2 id="inspect-name">小浮光</h2><p id="inspect-state">正在缓慢游动</p>
      <div class="mood-bar"><span id="mood-fill"></span></div><small>轻点它会有不同反应；拖到栖息地可以安排游玩。</small>
    </aside>
    <section class="action-dock glass" aria-label="建造和孕育">
      <div class="dock-group"><span class="dock-label">孕育</span>
        <button class="species-card is-unlocked" data-species="blue"><i class="swatch blue"></i><span>沉静</span><b>50 ◆</b></button>
        <button class="species-card" data-species="pink"><i class="swatch pink"></i><span>害羞</span><b>贝壳解锁</b></button>
        <button class="species-card" data-species="yellow"><i class="swatch yellow"></i><span>活泼</span><b>滑梯解锁</b></button>
      </div><div class="dock-separator"></div>
      <div class="dock-group"><span class="dock-label">生长</span>
        <button class="build-card" data-build="shell"><span>◡</span><em>贝壳休息台</em><b>30 ◆</b></button>
        <button class="build-card" data-build="slide"><span>〽</span><em>水母滑梯</em><b>150 ◆</b></button>
      </div>
    </section>
    <div id="toast" class="toast" role="status"></div>
    <section id="tutorial" class="tutorial glass" aria-labelledby="tutorial-title">
      <div class="tutorial-step">初次潜入 · <span id="tutorial-count">1 / 4</span></div><h2 id="tutorial-title">欢迎来到水母之森</h2>
      <p id="tutorial-copy">这里没有被切开的楼层。母水母的触须长成一棵发光的树，所有生命都生活在同一片深海里。</p>
      <div class="tutorial-actions"><button id="tutorial-skip" class="quiet">跳过</button><button id="tutorial-next" class="primary">继续</button></div>
    </section>
    <footer class="hint">拖动画面探索 · 滚轮缩放 · 点击水母互动 · 拖动水母安排栖息地</footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
